# ==========================================
# CONFIGURACIÓN DE LA APLICACIÓN
# ==========================================
spring.application.name=jwtPractice9

# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# ==========================================
# Cambiá "jwt_practice_db" por el nombre real de tu base de datos en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/jwt_practice_db?createDatabaseIfNotExist=true&serverTimezone=UTC
# Cambiá "root" por tu usuario de MySQL si es diferente
spring.datasource.username=root
# Colocá la contraseña de tu servidor local de MySQLaquí
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
# 'update' creará o modificará las tablas automáticamente sin borrar tus datos previos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# CONFIGURACIÓN DE SEGURIDAD (JWT y Cookies)
# ==========================================
# Tu clave de 256 bits en Hexadecimal
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971

# 604800000 ms equivale exactamente a 7 días (ideal para el Refresh Token)
refresh.expiration=604800000

# 180000 ms equivale exactamente a 3 min (ideal para el access Token)
access.expiration=180000

